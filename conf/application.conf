include "common.conf"
include "upload-template.conf"

include "backend.conf"

play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"

# Json error handler
play.http.errorHandler = "uk.gov.hmrc.play.bootstrap.backend.http.JsonErrorHandler"

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"


appName = "ers-file-validator"
play.http.router = prod.Routes
ers-file-validator-timeout-seconds = 70
validationChunkSize = 25000

largefiles {
  enabled = true
  maxrowspersheet = 10000
}

microservice {
  services {
    ers-submissions {
      host = localhost
      port = 9292
    }

    auth {
      host = localhost
      port = 8500
      login_path = "sign-in"
    }

    features {
      scheme-version {
        use-V4-and-V5 = true
        use-V6-and-V7 = false             #this will be enabled from 6th April 2027, no dual running
      }
    }
  }
}
file-size {
  #100MB
  uploadSizeLimit =  104857600
}

play.ws.timeout.request = 40.seconds

mongodb {
  uri = "mongodb://localhost:27017/"${appName}
  timeToLiveInSeconds = 3600
}
